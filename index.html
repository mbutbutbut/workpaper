<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workpaper</title>
<meta name="description" content="One shared checklist for the bookkeeper's document request.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root {
  --paper: #eaf1e2;
  --paper-deep: #dde8d2;
  --ink: #1f2933;
  --ink-soft: #4a5561;
  --rule: #b7c6aa;
  --rule-strong: #1f2933;
  --blue: #2557a7;
  --blue-wash: #e4ebf6;
  --red: #b8322a;
  --red-wash: #f7e3df;
  --focus: #2557a7;
  --field: #ffffff;
  --ink-hover: #303c49;
  --placeholder: #566270;
  --red-on-ink: #ffd9d4;
  --ink-rgb: 31, 41, 51;
  --paper-rgb: 234, 241, 226;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-pencil: "Caveat", "Segoe Print", cursive;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --pad: clamp(16px, 4vw, 40px);
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
::selection { background: var(--blue); color: var(--paper); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; caret-color: var(--blue); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* buttons */
.btn {
  border: 1.5px solid var(--ink);
  background: transparent;
  padding: 9px 16px;
  min-height: 40px;
  font-weight: 600;
  border-radius: 3px;
  transition: background-color .15s, color .15s;
}
.btn:hover { background: var(--paper-deep); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--ink-hover); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--blue); font-weight: 500; }

/* prototype strip */
.strip {
  display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between;
  padding: 8px var(--pad);
  background: var(--paper-deep);
  border-bottom: 1px solid var(--rule);
  font-size: 13px; color: var(--ink-soft);
}
.strip .who strong { color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--ink-soft); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; font-size: 13px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* sheet */
main { flex: 1; width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 var(--pad) 120px; }
.sheet-head { padding: 28px 0 16px; display: flex; flex-wrap: wrap; gap: 14px 24px; justify-content: space-between; align-items: flex-end; }
.sheet-head h1 { margin: 0; font-size: clamp(1.6rem, 3vw + .5rem, 2.4rem); line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.sheet-head p { margin: 6px 0 0; color: var(--ink-soft); max-width: 60ch; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 12px 0; border-top: 3px double var(--rule-strong); border-bottom: 1px solid var(--rule-strong); margin-bottom: 4px; font-weight: 500; }
.tally span { display: inline-flex; align-items: center; gap: 8px; }
.tally svg { width: 22px; height: 22px; }
.tally b { font-weight: 700; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 7px 12px; font-weight: 500; color: var(--ink-soft); border-bottom: 2px solid transparent; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.sortlbl { font-size: 14px; color: var(--ink-soft); display: inline-flex; gap: 8px; align-items: center; }

/* ledger table */
.ledger { width: 100%; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1.9fr) 92px 96px minmax(0, 1.1fr) 92px 52px minmax(0, 1.7fr); gap: 0 16px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.row.head { padding: 8px 0; border-bottom: 1px solid var(--rule-strong); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); align-items: center; }
.row.bk { grid-template-columns: 40px minmax(0, 1.9fr) 92px 96px minmax(0, 1.1fr) 72px 52px minmax(0, 1.7fr); }
.row .cell { font-size: 14px; color: var(--ink-soft); padding-top: 3px; overflow-wrap: anywhere; }
.row .cell-a { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.row.head .cell-a { text-align: right; }
.row.head .sel { padding: 0; margin: 0; align-self: center; place-items: center; }
.selall-btn { display: none; }
.row .descc .meta { display: none; }
.row .no { color: var(--ink-soft); font-size: 14px; padding-top: 3px; }
.row .desc { font-weight: 500; overflow-wrap: anywhere; }
.row .meta { display: block; color: var(--ink-soft); font-weight: 400; font-size: 14px; margin-top: 2px; }
.row .owner select, .row .ownertxt { font-size: 14px; }
.row .owner select { width: 100%; background: transparent; border: 1px solid transparent; border-bottom-color: var(--rule); padding: 4px 2px; border-radius: 0; }
.row .owner select:hover { border-bottom-color: var(--ink); }
.row .ownertxt { padding-top: 3px; display: inline-block; color: var(--ink-soft); }
.row.done .desc { color: var(--ink-soft); }
.row.flag { background-color: var(--red-wash); margin: 0 -10px; padding-left: 10px; padding-right: 10px; }
.note { font-family: var(--font-pencil); font-size: 21px; line-height: 1.15; color: var(--blue); padding-top: 2px; }
.note-in { width: 100%; border: 1px solid transparent; border-bottom: 1px dashed var(--rule); background: transparent; padding: 3px 2px; font-family: var(--font-pencil); font-size: 21px; color: var(--blue); border-radius: 0; }
.note-in::placeholder { color: var(--placeholder); font-family: var(--font-ui); font-size: 14px; }
.note-in:hover { border-bottom-color: var(--ink-soft); }
.note-in:focus { outline: none; border-bottom: 1px solid var(--blue); background: var(--blue-wash); }

/* tick */
.tick-cell { position: relative; }
.tickbtn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: 3px; padding: 0; margin: -6px 0 0 -6px; }
.tickbtn:hover { border-color: var(--ink-soft); background: var(--paper-deep); }
.tickbtn[aria-expanded="true"] { border-color: var(--ink); background: var(--paper-deep); }
.tick { width: 26px; height: 26px; overflow: visible; }
.tick .g { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.t-waiting { color: var(--ink-soft); }
.t-waiting .g { stroke-linecap: butt; } .t-hubdoc { color: var(--blue); } .t-jeff { color: var(--ink); }
.t-missing { color: var(--red); } .t-explained { color: var(--blue); }
.tick.draw .g { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .45s var(--ease-out) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.menu { position: absolute; z-index: 20; top: 38px; left: -8px; width: 232px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 3px; box-shadow: 0 8px 20px -6px rgba(var(--ink-rgb), .28); padding: 4px; }
.menu.up { top: auto; bottom: 38px; }
.menu button { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 2px; min-height: 40px; }
.menu button:hover, .menu button:focus-visible { background: var(--paper-deep); }
.menu button[aria-checked="true"] { font-weight: 700; }
.menu .tick { width: 22px; height: 22px; flex: none; }

/* legend foot */
.legend { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 3px double var(--rule-strong); padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
.legend ul { list-style: none; margin: 0 auto; padding: 0; max-width: 1320px; display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.legend .tick { width: 18px; height: 18px; }
.legend .ttl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

/* import panel */
.import { border: 1.5px solid var(--ink); padding: 18px; margin: 8px 0 16px; background: var(--paper); border-radius: 3px; }
.import h2 { margin: 0 0 4px; font-size: 1.15rem; }
.import p { margin: 0 0 12px; color: var(--ink-soft); max-width: 66ch; }
.import textarea { width: 100%; min-height: 130px; border: 1px solid var(--ink-soft); background: var(--field); padding: 10px; border-radius: 3px; font-size: 14px; }
.import .acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.import .err { color: var(--red); font-weight: 500; }
.import .ok { color: var(--blue); font-weight: 500; }

/* empty */
.empty { padding: 56px 0; max-width: 56ch; }
.empty h2 { margin: 0 0 8px; font-size: 1.4rem; }
.empty p { color: var(--ink-soft); margin: 0 0 18px; }

/* login */
.login { flex: 1; display: grid; place-items: center; padding: 40px var(--pad) 60px; }
.login-sheet { width: min(440px, 100%); }
.login-sheet h1 { margin: 0 0 6px; font-size: 2.2rem; letter-spacing: -0.02em; line-height: 1.05; }
.login-sheet .sub { color: var(--ink-soft); margin: 0 0 26px; }
.login-sheet .rule { border-top: 3px double var(--rule-strong); border-bottom: 1px solid var(--rule-strong); height: 8px; margin-bottom: 26px; }
.login-sheet label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
.login-sheet input { width: 100%; border: 1px solid var(--ink); background: var(--field); padding: 11px 12px; border-radius: 3px; min-height: 44px; margin-bottom: 14px; }
.login-sheet .btn { width: 100%; }
.proto { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--rule); }
.proto p { margin: 0 0 10px; font-size: 14px; color: var(--ink-soft); }
.proto .btns { display: grid; gap: 8px; }

/* jeff list */
.jrow { padding: 18px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
.jrow .top { display: flex; gap: 12px; align-items: flex-start; }
.jrow .top .tick { width: 30px; height: 30px; margin-top: 2px; flex: none; }
.jrow .jdesc { font-weight: 600; font-size: 1.05rem; }
.jrow .meta { color: var(--ink-soft); font-size: 14px; }
.jacts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.jacts.two { grid-template-columns: repeat(2, 1fr); }
.jacts button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; min-height: 64px; border: 1.5px solid var(--ink-soft); background: transparent; border-radius: 3px; font-size: 13px; font-weight: 600; text-align: center; }
.jacts button .tick { width: 22px; height: 22px; }
.jacts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.jacts button[aria-pressed="true"] .tick { color: var(--paper); }
.jrow .note-in { min-height: 44px; }

/* selection + bulk actions */
.row.cl { grid-template-columns: 30px 40px minmax(0, 1.9fr) 92px 96px minmax(0, 1.1fr) 92px 52px minmax(0, 1.7fr); }
.skip { position: absolute; left: 8px; top: -80px; z-index: 60; min-height: 44px; display: inline-flex; align-items: center; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 3px; font-weight: 600; text-decoration: none; }
.skip:focus { top: 8px; }
[tabindex="-1"]:focus { outline: none; }
.sel { display: grid; place-items: start center; padding: 10px 0 6px; margin: -8px 0 -4px; cursor: pointer; }
.sel input, .mcheck input { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); cursor: pointer; }
.mcheck { display: inline-flex; align-items: center; justify-content: center; width: 30px; padding: 8px 0; margin: -8px 0; cursor: pointer; }
.mhead.cl { padding-left: 0; }
.mhead .mcheck { display: none; }
.mhead.cl .mleft { padding-left: 10px; }
.mhead .mleft { display: inline-flex; align-items: center; gap: 10px; }
.row.selected { background-color: var(--blue-wash); }
.row.selected.flag { background-color: var(--red-wash); }
.bulkbar { position: fixed; left: var(--pad); right: var(--pad); max-width: calc(1320px - 2 * var(--pad)); margin: 0 auto; bottom: calc(var(--legend-h, 46px) + 8px); z-index: 15; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 3px; box-shadow: 0 -8px 16px -10px rgba(var(--ink-rgb), .55); }
.has-bulk main { padding-bottom: 220px; }
.bulkbar button.primary { background: var(--paper); color: var(--ink); }
.bulkbar button.primary:hover { background: #ffffff; }
.bulkbar .bcount { font-weight: 600; }
.bulkbar .bacts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bulkbar button { min-height: 40px; padding: 6px 14px; border: 1.5px solid var(--paper); background: transparent; color: var(--paper); border-radius: 3px; font-weight: 600; }
.bulkbar button:hover { background: rgba(var(--paper-rgb), .16); }
.bulkbar button.plain { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.bulkbar :focus-visible { outline-color: var(--paper); }
.bulkbar .reasonbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 320px; }
.bulkbar .reasonbox label { font-weight: 600; }
.bulkbar .reasonbox input { flex: 1 1 240px; min-height: 40px; padding: 6px 10px; border: 1px solid var(--paper); border-radius: 3px; background: var(--field); color: var(--ink); }
.bulkbar .rerr { color: var(--red-on-ink); font-weight: 500; width: 100%; }
.notice { margin: 8px 0; padding: 10px 14px; background: var(--blue-wash); border: 1px solid var(--blue); border-radius: 3px; font-weight: 500; }

/* sortable headers */
.hsort { display: inline-flex; align-items: baseline; gap: 4px; padding: 6px 0; margin: -6px 0; border: 0; background: none; font: inherit; line-height: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }
.hsort:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.hsort.on { color: var(--ink); }
.hsort svg { width: 10px; height: 10px; fill: currentColor; align-self: center; }
.cell-a .hsort { justify-content: flex-end; width: 100%; }

.row:not(.head) { content-visibility: auto; contain-intrinsic-size: auto 64px; }
.row.open-menu { content-visibility: visible; } /* the status menu hangs below its row and must not be clipped */

/* month groups */
.month { margin-top: 22px; }
.mhead { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; justify-content: space-between; padding: 8px 10px; background: var(--paper-deep); border-top: 3px double var(--rule-strong); border-bottom: 1px solid var(--rule-strong); }
.mhead h2 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
.mhead .mcount { font-size: 14px; color: var(--ink-soft); font-weight: 500; display: inline-flex; gap: 14px; align-items: center; }
.mhead .mcount { flex-wrap: wrap; gap: 2px 14px; }
.mhead .mcount span { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.mhead .mcount svg { width: 16px; height: 16px; }
.month .row.head { border-top: 0; }

/* jeff: plain words, reasons, no reflow */
.jrow.resolved .jdesc { color: var(--ink-soft); }
.jrow .jstate { font-weight: 600; }
.jecho { color: var(--ink-soft); font-size: 14px; }
.jlegend { list-style: none; margin: 28px 0 0; padding: 12px 0 0; border-top: 3px double var(--rule-strong); display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.jlegend li { display: inline-flex; align-items: center; gap: 7px; }
.jlegend .tick { width: 18px; height: 18px; }
.jrow .jchange { justify-self: start; }
.reason { border: 1.5px solid var(--ink); padding: 12px; border-radius: 3px; background: var(--field); display: grid; gap: 8px; }
.reason label { font-weight: 600; }
.reason input { width: 100%; border: 1px solid var(--ink-soft); padding: 10px; border-radius: 3px; min-height: 44px; background: var(--field); }
.reason .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.reason .err { color: var(--red); font-weight: 500; }
.warnlist li { align-items: flex-start; }
.rnote { margin: 0 0 10px; color: var(--ink-soft); max-width: 66ch; }
.preview { width: 100%; border-collapse: collapse; font-size: 14px; margin: 0 0 12px; }
.preview th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule-strong); }
.preview td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule); }
.preview .bad { color: var(--red); font-weight: 600; }

/* history + review */
.histbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; color: var(--ink-soft); }
.histbar select { border: 1px solid var(--ink-soft); background: var(--paper); padding: 6px 8px; border-radius: 3px; font-size: 14px; min-height: 34px; }
.pastbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; margin-bottom: 8px; background: var(--blue-wash); border: 1px solid var(--blue); border-radius: 3px; font-weight: 500; }
.review { margin-top: 14px; padding-top: 14px; border-top: 3px double var(--rule-strong); }
.review h3 { margin: 0 0 8px; font-size: 1.05rem; }
.review ul { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 4px; }
.review li { display: flex; gap: 10px; align-items: center; }
.review li svg { width: 20px; height: 20px; flex: none; }
.mark { color: var(--ink-soft); }
.mark.warn { color: var(--red); }
.review label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }
.review input[type=text] { width: min(420px, 100%); border: 1px solid var(--ink); background: var(--field); padding: 8px 10px; border-radius: 3px; min-height: 40px; margin-bottom: 12px; }
.new-badge { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); border: 1px solid var(--blue); padding: 0 6px; border-radius: 2px; vertical-align: 2px; }

/* responsive */
@media (max-width: 760px) {
  .row { grid-template-columns: 34px minmax(0, 1fr) 44px; gap: 4px 10px; }
  .row .cell { display: none; }
  .selall-btn { display: inline-flex; }
  .mhead .mcheck { display: inline-flex; }
  .mhead.cl .mleft { padding-left: 0; }
  .bulkbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 10px; }
  .bulkbar .bacts { display: contents; }
  .bulkbar .bcount { grid-column: 1; grid-row: 1; align-self: center; }
  .bulkbar button.primary { grid-column: 3; grid-row: 1; }
  .bulkbar button[data-bulk=clear] { grid-column: 2; grid-row: 1; justify-self: end; }
  .bulkbar button.plain { min-height: 44px; padding: 2px 8px; }
  .bulkbar button { font-size: 14px; padding: 4px 8px; line-height: 1.2; }
  .bulkbar .reasonbox { grid-column: 1 / -1; }
  .row.cl { grid-template-columns: 28px 28px minmax(0, 1fr) 44px; }
  .mcheck { width: 28px; }
  .row.cl .sel { grid-column: 1; grid-row: 1; }
  .row.cl .no { grid-column: 2; grid-row: 1; }
  .row.cl .descc { grid-column: 3; grid-row: 1; }
  .row.cl .tick-cell { grid-column: 4; grid-row: 1; }
  .row.cl .owner, .row.cl .ownertxt { grid-column: 3 / 5; grid-row: 2; }
  .row.cl .notec { grid-column: 3 / 4; grid-row: 3; }
  .row.cl .thc { grid-column: 4; grid-row: 3; }
  .row.bk .thc { grid-column: 2 / 4; grid-row: 4; justify-content: flex-start; }
  .row.bk .notec { grid-column: 2 / 3; }
  .thbtn { height: 44px; min-width: 44px; }
  .thc .btn.small { min-height: 44px; }
  .row .descc .meta { display: block; }
  .row.head { display: none; }
  .row .no { grid-row: 1; grid-column: 1; }
  .row .descc { grid-column: 2; grid-row: 1; }
  .row .tick-cell { grid-column: 3; grid-row: 1; }
  .row .owner, .row .ownertxt { grid-column: 2 / 4; grid-row: 2; }
  .row .notec { grid-column: 2 / 4; grid-row: 3; }
  .row.bk { grid-template-columns: 34px minmax(0, 1fr) 44px; }
  .row.flag { margin: 0 -8px; padding-left: 8px; padding-right: 8px; }
  .menu { left: auto; right: -4px; }
  .legend ul { gap: 4px 14px; font-size: 12px; }
  .legend .ttl { display: none; }
  main { padding-bottom: 150px; }

      if (ui.filter === 'review') return (i.status === 'hubdoc' || i.status === 'explained') && !i.reviewed;

  // ----- Team (admin only) -----
  function makePassword() {
    var chars = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '', buf = new Uint32Array(16);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    for (var i = 0; i < buf.length; i++) out += chars[buf[i] % chars.length];
    return out;
  }
  function teamCall(action, extra) {
    return remote.auth.getSession().then(function (r) {
      var sess = r.data && r.data.session; if (!sess) throw new Error('Sign in again.');
      return fetch('/api/team', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sess.access_token, 'x-apikey': CFG.supabaseAnonKey }, body: JSON.stringify(Object.assign({ action: action }, extra || {})) });
    }).then(function (res) {
      return res.json().catch(function () { return { error: 'The team service did not answer. It may not be set up yet.' }; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        return data;

    });

  /* ---------- review and conversation ---------- */
  var SEEN_KEY = 'workpaper-seen-v1';
  function loadSeen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; } }
  var seen = loadSeen();
  function saveSeen() { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} }
  function msgs(it) { return (state.comments && state.comments[it.fp]) || []; }
  function seenKey(it) { return (state.user || state.role || '') + '|' + it.fp; }
  function isUnread(it) { var last = seen[seenKey(it)] || ''; return msgs(it).some(function (m) { return m.role !== state.role && String(m.at) > last; }); }
  function lastReopen(it) { var l = msgs(it).filter(function (m) { return m.kind === 'reopen'; }); return l.length ? l[l.length - 1] : null; }
  function canAccept(it) { return state.role === 'bookkeeper' && (it.status === 'hubdoc' || it.status === 'explained') && !it.reviewed; }
  function canReopen(it) { return state.role === 'bookkeeper' && (it.status === 'hubdoc' || it.status === 'explained' || it.status === 'missing'); }
  function fmtTime(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  function findItem(id) { return state.items.find(function (x) { return x.id === id; }); }

  function markSvg(inner, cls) { return '<svg class="tick ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg>'; }
  // Reviewed: a check inside a ring (the bookkeeper has signed off). Sent back: a return arrow. Messages: a speech mark.
  function markReviewed() { return markSvg('<circle class="g" cx="12" cy="12" r="9"/><path class="g" d="M7.5 12.5 L10.7 15.5 L16.5 9"/>', 't-hubdoc'); }
  function markReturn() { return markSvg('<path class="g" d="M9 6 L4 11 L9 16"/><path class="g" d="M4 11 H14 a6 6 0 0 1 0 12 H10"/>', 't-jeff'); }
  function markMsg() { return markSvg('<path class="g" d="M4 5 H20 V16 H11 L6 20 V16 H4 Z"/>', 't-jeff'); }

  // A message is "mine" if I wrote it. In the prototype each role is a different person.
  function isMine(m) { return m.kind === 'message' && !m.removed && (useRemote ? m.author === state.uid : m.role === state.role); }
  function findMsg(id) {
    var found = null;
    Object.keys(state.comments).forEach(function (k) { state.comments[k].forEach(function (m) { if (m.id === id) found = m; }); });
    return found;
  }
  function editMessage(m, body) {
    if (useRemote) return remote.from('comments').update({ body: body }).eq('id', m.id).then(function (r) { if (r.error) throw r.error; return loadRemote(); });
    m.body = body; m.edited = true; save(); return Promise.resolve();
  }
  function removeMessage(m) {
    if (useRemote) return remote.from('comments').update({ removed: true }).eq('id', m.id).then(function (r) { if (r.error) throw r.error; return loadRemote(); });
    m.removed = true; m.body = 'Message removed'; m.edited = true; save(); return Promise.resolve();
  }
  function deleteItems(ids) {
    if (useRemote) return remote.from('items').delete().in('id', ids).then(function (r) { if (r.error) throw r.error; return loadRemote(); });
    var gone = state.items.filter(function (i) { return ids.indexOf(i.id) > -1; });
    state.items = state.items.filter(function (i) { return ids.indexOf(i.id) < 0; });
    gone.forEach(function (i) { if (!state.items.some(function (x) { return x.fp === i.fp; })) delete state.comments[i.fp]; });
    save(); return Promise.resolve();
  }

  function addComment(it, role, kind, body) {
    var list = state.comments[it.fp] = state.comments[it.fp] || [];
    list.push({ id: 'c' + Date.now() + list.length, role: role, kind: kind, body: body, at: new Date().toISOString() });
  }
  // Each action works on the local prototype data, or asks the database to do it (which checks the rules).
  function reviewAction(kind, it, message) {
    if (useRemote) {
      var call = kind === 'accept' ? remote.rpc('accept_item', { p_item: it.id }) : remote.rpc('reopen_item', { p_item: it.id, p_message: message });
      return call.then(function (r) { if (r.error) throw r.error; return loadRemote(); });
    }
    if (kind === 'accept') { it.reviewed = true; it.sentBack = false; addComment(it, 'bookkeeper', 'accept', 'Accepted'); }
    else { it.status = 'waiting'; it.owner = 'me'; it.reviewed = false; it.sentBack = true; addComment(it, 'bookkeeper', 'reopen', message); }
    save(); return Promise.resolve();
  }
  function sendMessage(it, body) {
    if (useRemote) {
      return remote.from('comments').insert({ fingerprint: it.fp, author_id: state.uid, role: state.role, kind: 'message', body: body })
        .then(function (r) { if (r.error) throw r.error; return loadRemote(); });
    }
    addComment(it, state.role, 'message', body); save(); return Promise.resolve();
  }

  function threadButton(it) {
    var n = msgs(it).length, open = ui.threadFor === it.id;
    return '<button type="button" class="thbtn' + (open ? ' on' : '') + '" data-thread="' + it.id + '" aria-expanded="' + open + '" aria-label="Conversation about item ' + it.no + ', ' + n + (n === 1 ? ' message' : ' messages') + (isUnread(it) ? ', new' : '') + '">' +
      markMsg() + '<span class="thn num">' + (n || '') + '</span>' + (isUnread(it) ? '<span class="newdot" aria-hidden="true"></span>' : '') + '</button>';
  }
  function threadCell(it, mode) {
    var h = '<div class="thc">';
    if (it.reviewed) h += '<span class="reviewed" title="Reviewed by the bookkeeper">' + markReviewed() + '<span class="sr">Reviewed</span></span>';
    if (state.role === 'bookkeeper' && mode === 'bk' && !pastView()) {
      if (canAccept(it)) h += '<button type="button" class="btn small" data-review="accept:' + it.id + '">Accept</button>';
      if (canReopen(it)) h += '<button type="button" class="btn small" data-review="ask:' + it.id + '">Reopen\u2026</button>';
    }
    return h + threadButton(it) + '</div>';
  }
  function sentTag(it) {
    if (!it.sentBack) return '';
    var m = lastReopen(it);
    return '<span class="sent">' + markReturn() + '<span><b>Sent back</b>' + (m ? ': \u201c' + esc(m.body.length > 90 ? m.body.slice(0, 87) + '\u2026' : m.body) + '\u201d' : '') + '</span></span>';
  }
  function threadPanel(it, plain) {
    var list = msgs(it);
    var items = list.length ? list.map(function (m) {
      var tag = m.kind === 'reopen' ? '<span class="mtag">Sent back</span>' : m.kind === 'accept' ? '<span class="mtag ok">Accepted</span>' : '';
      var when = '<time datetime="' + esc(m.at) + '">' + esc(fmtTime(m.at)) + '</time>' + (m.edited && !m.removed ? '<span class="edited">edited</span>' : '');
      var head = '<div class="mhd"><b>' + esc(ROLE_LABEL[m.role] || m.role) + '</b> ' + tag + when + '</div>';
      if (m.removed) return '<li class="msg gone">' + head + '<p class="removed">Message removed</p></li>';
      if (ui.editMsg === m.id) {
        return '<li class="msg editing">' + head + '<label class="sr" for="editBody">Edit your message</label><textarea id="editBody" maxlength="1000" rows="3">' + esc(m.body) + '</textarea>' +
          (ui.threadErr ? '<span class="err" role="alert">' + esc(ui.threadErr) + '</span>' : '') +
          '<div class="acts"><button type="button" class="btn small primary" data-msg="save:' + esc(m.id) + '">Save</button><button type="button" class="btn small" data-msg="cancel">Cancel</button></div></li>';
      }
      var mine = '';
      if (isMine(m) && !pastView()) {
        mine = ui.removeMsg === m.id
          ? '<div class="macts"><span class="ask">Remove this message?</span> <button type="button" class="btn small danger" data-msg="remove:' + esc(m.id) + '">Remove</button> <button type="button" class="btn small" data-msg="cancel">Cancel</button></div>'
          : '<div class="macts"><button type="button" class="link" data-msg="edit:' + esc(m.id) + '">Edit</button><button type="button" class="link" data-msg="ask:' + esc(m.id) + '">Remove</button></div>';
      }
      return '<li class="msg ' + esc(m.kind) + '">' + head + '<p>' + (m.kind === 'accept' ? '' : esc(m.body)) + '</p>' + mine + '</li>';
    }).join('') : '<li class="msg none">No messages yet.</li>';
    var draft = (ui.draft && ui.draft[it.id]) || '';
    var review = '';
    if (state.role === 'bookkeeper' && !pastView()) {
      if (canReopen(it)) review += '<button type="button" class="btn" data-review="reopen:' + it.id + '">Send back with this message</button>';
      if (canAccept(it)) review += '<button type="button" class="btn" data-review="accept:' + it.id + '">Accept</button>';
    }
    return '<div class="thread"' + (plain ? '' : ' role="row"') + '><div class="thread-in"' + (plain ? '' : ' role="cell"') + '><div class="thead"><h3>Conversation: ' + esc(it.desc) + '</h3><button type="button" class="link" data-act="closethread">Close</button></div>' +
      '<ol class="msgs" aria-label="Messages">' + items + '</ol>' +
      (pastView() ? '' : '<form class="tform" data-item="' + it.id + '"><label for="threadBody">Message</label><textarea id="threadBody" maxlength="1000" rows="3" placeholder="' +
        (state.role === 'bookkeeper' && canReopen(it) ? 'Say what is missing, then choose Send back. Or just reply.' : 'Write a reply') + '">' + esc(draft) + '</textarea>' +
        (ui.threadErr ? '<span class="err" role="alert">' + esc(ui.threadErr) + '</span>' : '') +
        '<div class="acts"><button type="submit" class="btn primary">Send</button>' + review + '</div></form>') + '</div></div>';
  }

  function rowHTML(item, mode) {
    var done = !STATUS[item.status].open && item.status !== 'missing';
    var cls = 'row' + (done ? ' done' : '') + (item.status === 'missing' ? ' flag' : '') + (mode === 'bk' ? ' bk' : '') + (mode === 'client' ? ' cl' + (ui.sel[item.id] ? ' selected' : '') : '');
    var meta = esc(item.date) + (item.amount ? ' · <span class="num">' + money(item.amount) + '</span>' : '') + (item.source ? ' · ' + esc(item.source) : '');
    var owner;
    if (mode === 'client') {
      owner = '<div class="owner"><label class="sr" for="o' + item.id + '">Owner of item ' + item.no + '</label><select id="o' + item.id + '" data-owner="' + item.id + '"><option value="me"' + (item.owner === 'me' ? ' selected' : '') + '>Me</option><option value="jeff"' + (item.owner === 'jeff' ? ' selected' : '') + '>Jeff</option></select></div>';
    } else {
      owner = '<span class="ownertxt">' + (item.owner === 'jeff' ? 'Jeff' : 'Client') + '</span>';
    }
    var note;
    if (mode === 'client') {
      note = '<div class="notec"><label class="sr" for="n' + item.id + '">Note for item ' + item.no + '</label><input class="note-in" id="n' + item.id + '" data-note="' + item.id + '" value="' + esc(item.note) + '" placeholder="Add a note"></div>';
    } else {
      note = '<div class="notec note">' + esc(item.note) + '</div>';
    }
    var selCell = mode === 'client' ? '<label class="sel"><input type="checkbox" data-sel="' + item.id + '"' + (ui.sel[item.id] ? ' checked' : '') + '><span class="sr">Select item ' + item.no + '</span></label>' : '';
    return '<div class="' + cls + '">' + selCell + '<div class="no num">' + item.no + '</div>' +
      '<div class="descc"><span class="desc">' + esc(item.desc) + '</span><span class="meta">' + meta + '</span>' + sentTag(item) + '</div>' +
      '<div class="cell cell-d num">' + (esc(item.date) || '\u2014') + '</div>' +
      '<div class="cell cell-a">' + (money(item.amount) || '\u2014') + '</div>' +
      '<div class="cell cell-s">' + (esc(item.source) || '\u2014') + '</div>' +
      owner + tickCell(item, mode === 'client') + note + threadCell(item, mode) + '</div>' + (ui.threadFor === item.id ? threadPanel(item) : '');
  }

  function ledger(items, mode) {
    if (!items.length) return '<p class="empty" style="padding:32px 0;color:var(--ink-soft)">Nothing matches this filter.</p>';
    var groups = [], last;
    items.forEach(function (it) {
      var k = monthKey(it);
      if (!last || last.key !== k) { last = { key: k, items: [] }; groups.push(last); }
      last.items.push(it);
    });
    function sortBtn(key, label) {
      var on = ui.col && ui.col.key === key, dir = on ? ui.col.dir : 0;
      var tri = dir === -1 ? '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3h8L5 8z"/></svg>' : dir === 1 ? '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 7h8L5 2z"/></svg>' : '';
      var state = on ? (dir === -1 ? 'sorted ' + (key === 'amount' ? 'largest first' : 'newest first') : 'sorted ' + (key === 'amount' ? 'smallest first' : 'oldest first')) : 'sorted in the default order';
      return '<button type="button" class="hsort' + (on ? ' on' : '') + '" data-col="' + key + '" aria-label="' + label + ', ' + state + '. Activate to change.">' + label + tri + '</button>';
    }
    function headRowFor(g) {
      var nSel = g.items.filter(function (i) { return ui.sel[i.id]; }).length;
      var box = mode === 'client' ? '<div><label class="sel"><input type="checkbox" data-selmonth="' + g.key + '"' + (nSel === g.items.length ? ' checked' : '') + (nSel && nSel < g.items.length ? ' data-partial="1"' : '') + '><span class="sr">Select all items in ' + esc(monthLabel(g.key)) + '</span></label></div>' : '';
      return '<div class="row head' + (mode === 'bk' ? ' bk' : ' cl') + '">' + box + '<div>No.</div><div>Item</div><div data-sortcell="date">' + sortBtn('date', 'Date') + '</div><div class="cell-a" data-sortcell="amount">' + sortBtn('amount', 'Amount') + '</div><div>Account</div><div>Owner</div><div>Status</div><div>Note</div><div><span class="sr">Conversation</span></div></div>';
    }
    return '<div class="ledger" id="list" tabindex="-1">' + groups.map(function (g) {
      var open = g.items.filter(function (i) { return i.status === 'waiting' || i.status === 'jeff'; }).length;
      var flag = g.items.filter(function (i) { return i.status === 'missing'; }).length;
      var done = g.items.length - open - flag;
      var wClient = g.items.filter(function (i) { return i.status === 'waiting'; }).length;
      var wJeff = g.items.filter(function (i) { return i.status === 'jeff'; }).length;
      var count = state.role === 'bookkeeper' ? '<span class="mcount">' +
        '<span>' + glyph('waiting') + wClient + ' on client</span>' +
        '<span>' + glyph('jeff') + wJeff + ' with Jeff</span>' +
        (flag ? '<span>' + glyph('missing') + flag + ' no document</span>' : '') +
        '<span>' + glyph('hubdoc') + done + ' done</span></span>' : '<span class="mcount">' +
        '<span>' + glyph('waiting') + open + ' open</span>' +
        (flag ? '<span>' + glyph('missing') + flag + ' no document</span>' : '') +
        '<span>' + glyph('hubdoc') + done + ' done</span></span>';
      var nSel = g.items.filter(function (i) { return ui.sel[i.id]; }).length;
      var mcheck = mode === 'client' ? '<label class="mcheck"><input type="checkbox" data-selmonth="' + g.key + '"' + (nSel === g.items.length ? ' checked' : '') + (nSel && nSel < g.items.length ? ' data-partial="1"' : '') + '><span class="sr">Select all items in ' + esc(monthLabel(g.key)) + '</span></label>' : '';
      return '<section class="month" aria-label="' + esc(monthLabel(g.key)) + '"><div class="mhead' + (mode === 'client' ? ' cl' : '') + '"><span class="mleft">' + mcheck + '<h2>' + esc(monthLabel(g.key)) + '</h2></span>' + count + '</div>' +
        '<div class="tbl" role="table" aria-label="' + esc(monthLabel(g.key)) + ' items">' + headRowFor(g) +
        g.items.map(function (i) { return rowHTML(i, mode); }).join('') + '</div></section>';
    }).join('') + '</div>';
  }

  function histBar() {
    if (!state.history.length) return '';
    var opts = '<option value=""' + (!ui.viewId ? ' selected' : '') + '>Current: ' + esc(state.cycle) + '</option>' +
      state.history.map(function (h) { return '<option value="' + h.id + '"' + (ui.viewId === h.id ? ' selected' : '') + '>' + esc(h.name) + '</option>'; }).join('');
    return '<div class="histbar"><label for="histSel">Request</label><select id="histSel">' + opts + '</select></div>';
  }
  function pastBar() {
    var p = pastView();
    return p ? '<div class="pastbar"><span>Past request, read-only. Imported ' + esc(p.importedAt || '') + '.</span><button type="button" class="btn small" data-act="backcurrent">Back to current request</button></div>' : '';
  }

  function renderClient() {
    var past = pastView();
    var items = viewItems();
    var hasItems = items.length > 0;
    var head = '<div class="sheet-head"><div><h1>' + esc(viewName()) + '</h1><p>From ' + esc(state.from) + (state.sample && !past ? '. Sample data, replace it with an import.' : '.') + '</p></div>' +
      '<div style="display:grid;gap:10px;justify-items:end">' + '<button type="button" class="btn primary" data-act="openimport">Import request</button>' + histBar() + '</div></div>';
    var body;
    if (!hasItems) {
      body = '<div class="empty"><h2>No request yet</h2><p>Import the spreadsheet your bookkeeper emailed. Each row becomes an item you can tick off, note, or pass to Jeff.</p><button type="button" class="btn primary" data-act="openimport">Import request</button></div>';
    } else {
      var shownIds = {}; shownItems().forEach(function (i) { shownIds[i.id] = 1; });
      Object.keys(ui.sel).forEach(function (k) { if (!shownIds[k] || past) delete ui.sel[k]; });
      body = pastBar() + tally() + (past ? '' : bulkBar()) + toolbar(!past) + ledger(shownItems(), past ? 'bk' : 'client');
    }
    return strip() + '<main id="main" tabindex="-1">' + head + (ui.importOpen ? importPanel() : '') + body + '</main>' + (hasItems ? legend() : '');
  }

  /* ---------- bookkeeper ---------- */
  function renderBookkeeper() {
    var past = pastView();
    var head = '<div class="sheet-head"><div><h1>' + esc(viewName()) + '</h1><p>Review what has been resolved. Accept it, or send it back with a reason. It updates as they work.</p></div>' + histBar() + '</div>';
    if (!viewItems().length) return strip() + '<main id="main" tabindex="-1">' + head + '<div class="empty"><h2>Nothing to show yet</h2><p>The client has not imported this request.</p></div></main>';
    return strip() + '<main id="main" tabindex="-1">' + head + pastBar() + tally() + toolbar(false) + ledger(shownItems(), 'bk') + '</main>' + legend();
  }

  /* ---------- jeff ---------- */
  var JEFF_WORD = { jeff: 'Waiting for you', hubdoc: 'Done', missing: 'No document', explained: 'Noted', waiting: 'Waiting' };

  function renderJeff() {
    var mine = state.items.filter(function (i) { return i.owner === 'jeff'; }).sort(function (a, b) {
      return monthKey(a) - monthKey(b) || dayKey(a) - dayKey(b) || a.no - b.no;
    });
    var waiting = mine.filter(function (i) { return i.status === 'jeff'; }).length;
    var lead = mine.length ? (waiting ? waiting + ' of ' + mine.length + ' items still need you.' : 'All ' + mine.length + ' items are dealt with. Thank you.') : 'Nothing has been passed to you yet.';
    var hint = waiting ? ' Upload each receipt to Hubdoc first, then tap “I have it”.' : '';
    var head = '<div class="sheet-head"><div><h1>Your list</h1><p>' + lead + hint + '</p></div></div>';
    var body;
    if (!mine.length) {
      body = '<div class="empty"><h2>Nothing for you yet</h2><p>When the client passes purchases to you, they will show up here.</p></div>';
    } else {
      var jc = { jeff: 0, hubdoc: 0, missing: 0, explained: 0 };
      mine.forEach(function (i) { if (jc[i.status] != null) jc[i.status]++; });
      var jtally = '<div class="tally" aria-label="Summary">' +
        '<span>' + glyph('jeff') + '<b class="num">' + jc.jeff + '</b> waiting for you</span>' +
        '<span>' + glyph('hubdoc') + '<b class="num">' + jc.hubdoc + '</b> done</span>' +
        (jc.missing ? '<span>' + glyph('missing') + '<b class="num">' + jc.missing + '</b> no document</span>' : '') +
        (jc.explained ? '<span>' + glyph('explained') + '<b class="num">' + jc.explained + '</b> noted</span>' : '') + '</div>';
      var jgroups = [], jlast;
      mine.forEach(function (i) { var k = monthKey(i); if (!jlast || jlast.key !== k) { jlast = { key: k, items: [] }; jgroups.push(jlast); } jlast.items.push(i); });
      function jrowHTML(i) {
        var open = i.status === 'jeff';
        var meta = esc(i.date) + (i.amount ? ' · <span class="num">' + money(i.amount) + '</span>' : '');
        var action;
        if (ui.explainFor === i.id) {
          action = '<div class="reason"><label for="jr' + i.id + '">Why is there no document?</label>' +
            '<input id="jr' + i.id + '" type="text" value="' + esc(i.note) + '" placeholder="e.g. Paid cash, no receipt">' +
            (ui.reasonErr === i.id ? '<span class="err" role="alert">Add a short reason so the bookkeeper knows.</span>' : '') +
            '<div class="acts"><button type="button" class="btn primary" data-jsave="' + i.id + '">Save</button><button type="button" class="btn" data-jcancel="1">Cancel</button></div></div>';
        } else if (open) {
          action = '<div class="jacts two">' +
            '<button type="button" data-jset="' + i.id + ':hubdoc">' + glyph('hubdoc') + 'I have it</button>' +
            '<button type="button" data-jset="' + i.id + ':missing">' + glyph('missing') + 'No document</button></div>';
        } else {
          action = '<button type="button" class="btn small jchange" data-jchange="' + i.id + '">Change</button>';
        }
        var echo = '';
        return '<div class="jrow' + (open ? '' : ' resolved') + '" role="listitem"><div class="jno num" aria-hidden="true">' + i.no + '</div><div class="top">' + glyph(i.status, ui.drawId === i.id) +
          '<div><div class="jdesc">' + esc(i.desc) + '</div><div class="meta">' + meta + ' · <span class="jstate">' + esc(JEFF_WORD[i.status]) + '</span></div>' + sentTag(i) + '</div></div>' +
          action + echo +
          '<div><label class="sr" for="jn' + i.id + '">Note for item ' + i.no + '</label><input class="note-in" id="jn' + i.id + '" data-note="' + i.id + '" value="' + esc(i.note) + '" placeholder="Add a note, e.g. what this was for"></div>' +
          '<div class="jthread">' + threadButton(i) + '<span class="jthl">' + (msgs(i).length ? (msgs(i).length === 1 ? '1 message' : msgs(i).length + ' messages') : 'Message the team') + '</span></div>' +
          (ui.threadFor === i.id ? threadPanel(i, true) : '') + '</div>';
      }
      body = '<div class="jlist" id="list" tabindex="-1">' + (ui.notice ? '<div class="notice" role="status">' + esc(ui.notice) + (ui.jundo ? ' <button type="button" class="link" data-jundo="1">Undo</button>' : '') + '</div>' : '') + jtally +
        jgroups.map(function (g) {
          var waitingHere = g.items.filter(function (i) { return i.status === 'jeff'; }).length;
          return '<section class="month" aria-label="' + esc(monthLabel(g.key)) + '"><div class="mhead"><span class="mleft"><h2>' + esc(monthLabel(g.key)) + '</h2></span>' +
            '<span class="mcount"><span>' + glyph('jeff') + waitingHere + ' waiting for you</span></span></div><div role="list">' + g.items.map(jrowHTML).join('') + '</div></section>';
        }).join('') + '</div>' +
        '<ul class="jlegend" aria-label="What the marks mean">' +
        '<li>' + glyph('jeff') + 'Waiting for you</li><li>' + glyph('hubdoc') + 'Done</li><li>' + glyph('missing') + 'No document</li><li>' + glyph('explained') + 'Noted by client</li></ul>';
    }
    return strip() + '<main id="main" tabindex="-1">' + head + body + '</main>';
  }

  /* ---------- render ---------- */
  var app = document.getElementById('app');
  function render(focusSel) {
    invalidate();
    var scroll = window.scrollY;
    if (ui.loading) app.innerHTML = '<div class="login"><div class="login-sheet"><h1>Workpaper</h1><p class="sub">Loading\u2026</p></div></div>';
    else if (!state.user) app.innerHTML = renderLogin();
    else if (state.role === 'jeff') app.innerHTML = renderJeff();
    else if (state.role === 'bookkeeper') app.innerHTML = renderBookkeeper();
    else app.innerHTML = renderClient();
    ui.drawId = null;
    if (useRemote && state.role === 'client' && ui.teamOpen) { var teamMain = app.querySelector('main'); if (teamMain) teamMain.insertAdjacentHTML('afterbegin', teamPanel()); }
    if (useRemote && state.user && ui.accountOpen) { var mainEl = app.querySelector('main'); if (mainEl) mainEl.insertAdjacentHTML('afterbegin', accountPanel()); }
    app.querySelectorAll('.tbl .row').forEach(function (row) {
      var head = row.classList.contains('head');
      row.setAttribute('role', 'row');
      Array.prototype.forEach.call(row.children, function (c) { c.setAttribute('role', head ? 'columnheader' : 'cell'); });
    });
    app.querySelectorAll('[data-sortcell]').forEach(function (c) {
      var k = c.getAttribute('data-sortcell'), on = ui.col && ui.col.key === k;
      c.setAttribute('aria-sort', on ? (ui.col.dir === -1 ? 'descending' : 'ascending') : (k === 'date' ? 'ascending' : 'none'));
    });
    var skip = document.getElementById('skiplink');
    if (state.user && !ui.loading) {
      if (!skip) { skip = document.createElement('a'); skip.id = 'skiplink'; skip.className = 'skip'; skip.textContent = 'Skip to the checklist'; app.insertBefore(skip, app.firstChild); }
      skip.setAttribute('href', document.getElementById('list') ? '#list' : '#main');
    }
    var legEl = document.querySelector('.legend');
    document.documentElement.style.setProperty('--legend-h', (legEl ? Math.round(legEl.getBoundingClientRect().height) : 0) + 'px');
    document.body.classList.toggle('has-bulk', !!app.querySelector('.bulkbar'));
    var menuNode = app.querySelector('.menu');
    if (menuNode) {
      var menuRow = menuNode.closest('.row'); if (menuRow) menuRow.classList.add('open-menu');
      var legNode = document.querySelector('.legend'), limit = window.innerHeight - (legNode ? legNode.getBoundingClientRect().height : 0) - 8;
      if (menuNode.getBoundingClientRect().bottom > limit) menuNode.classList.add('up');
    }
    app.querySelectorAll('input[data-partial]').forEach(function (i) { i.indeterminate = true; });
    window.scrollTo(0, scroll);
    if (focusSel) { var el = app.querySelector(focusSel); if (el) el.focus(); }
  }

  /* ---------- csv ---------- */
  function parseCSV(text) {
    var rows = [], row = [], cur = '', q = false, i, ch;
    var delim = text.indexOf('\t') > -1 && text.indexOf(',') === -1 ? '\t' : ',';
    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c.trim(); }); });
  }

  var DESC_KEYS = ['memo/description', 'description', 'memo', 'item', 'details', 'vendor', 'payee'];
  function serialToDate(n) {
    var d = new Date(Math.round((n - 25569) * 86400000));
    return ('0' + (d.getUTCMonth() + 1)).slice(-2) + '/' + ('0' + d.getUTCDate()).slice(-2) + '/' + d.getUTCFullYear();
  }
  function cellText(v) { return typeof v === 'number' ? String(v) : String(v == null ? '' : v).trim(); }

  // Finds the header row anywhere in the first 30 rows (accounting exports put a title block above it),
  // skips TOTAL and timestamp rows below the data.
  function readTable(rows) {
    var h = -1, i;
    for (i = 0; i < Math.min(rows.length, 30); i++) {
      var low = rows[i].map(function (c) { return cellText(c).toLowerCase(); });
      if (low.indexOf('date') > -1 && DESC_KEYS.concat(['name']).some(function (k) { return low.indexOf(k) > -1; })) { h = i; break; }
    }
    if (h < 0) return { error: 'Could not find a header row with a Date column and a description column.' };
    var head = rows[h].map(function (c) { return cellText(c).toLowerCase(); });
    function find(names) { for (var n = 0; n < names.length; n++) { var ix = head.indexOf(names[n]); if (ix > -1) return ix; } return -1; }
    var iDate = find(['date', 'transaction date']), iMemo = find(DESC_KEYS), iName = find(['name']);
    var iAmt = find(['amount', 'total', 'debit']), iSrc = find(['split', 'account', 'card', 'paid from']), iNote = find(['note', 'notes', 'comment', 'comments']);
    var items = [];
    rows.slice(h + 1).forEach(function (r) {
      var first = cellText(r[0]).toLowerCase();
      if (first === 'total' || first.indexOf('total') === 0) return;
      var name = iName > -1 ? cellText(r[iName]) : '';
      var memo = iMemo > -1 ? cellText(r[iMemo]).replace(/View more\s*/g, '').trim() : '';
      var dateRaw = iDate > -1 ? r[iDate] : '';
      var date = typeof dateRaw === 'number' ? serialToDate(dateRaw) : cellText(dateRaw);
      var amtRaw = iAmt > -1 ? cellText(r[iAmt]).replace(/[$,]/g, '') : '';
      var amt = amtRaw !== '' && !isNaN(parseFloat(amtRaw)) ? parseFloat(amtRaw).toFixed(2) : amtRaw;
      if (!(name || memo) || !(date || amt)) return;
      var src = iSrc > -1 ? cellText(r[iSrc]).replace(/^\d{3,5}\s+/, '') : '';
      var problems = [];
      if (!date) problems.push('noDate');
      if (amt === '') problems.push('noAmount'); else if (isNaN(parseFloat(amt)) || !/^-?[\d.]+$/.test(amt)) problems.push('badAmount');
      items.push({ date: date, amount: amt, desc: name || memo, memo: name ? memo : '', source: src, note: iNote > -1 ? cellText(r[iNote]) : '', problems: problems });
    });
    if (!items.length) return { error: 'Found the header row but no transactions under it.' };
    var title = h > 0 ? [cellText(rows[0][0]), cellText(rows[Math.min(2, h - 1)][0])].filter(Boolean).join(', ') : '';
    return { items: items, title: title };
  }

  // Compares the sheet against the current request and every past one, carrying over what is already known.
  function planImport(table) {
    var known = {};
    state.history.slice().reverse().forEach(function (hs) { hs.items.forEach(function (it) { known[it.fp] = it; }); });
    state.items.forEach(function (it) { known[it.fp] = it; });
    stampFingerprints(table.items);
    var carried = 0, fresh = 0, twins = 0, seenFp = {}, warn = { noDate: 0, noAmount: 0, badAmount: 0 };
    var stamp = Date.now();
    var items = table.items.map(function (it, n) {
      var old = known[it.fp];
      var out = { id: 'i' + stamp + '_' + n, no: n + 1, date: it.date, desc: it.desc, memo: it.memo, amount: it.amount, source: it.source, fp: it.fp,
        owner: old ? old.owner : 'me', status: old ? old.status : 'waiting', note: old ? old.note : it.note, isNew: !old && (state.items.length > 0), reviewed: old ? !!old.reviewed : false, sentBack: old ? !!old.sentBack : false };
      if (old) carried++; else fresh++;
      (it.problems || []).forEach(function (k) { warn[k]++; });
      if (/#[1-9]\d*$/.test(it.fp)) twins++;
      seenFp[it.fp] = 1;
      return out;
    });
    var dropped = state.items.filter(function (it) { return !seenFp[it.fp]; }).length;
    var today = new Date().toISOString().slice(0, 10);
    return { name: table.title || ('Request ' + today), items: items, stats: { total: items.length, carried: carried, fresh: fresh, twins: twins, dropped: dropped, warn: warn },
      preview: table.items.slice(0, 5) };
  }

  function stageRows(rows) {
    var t = readTable(rows);
    if (t.error) { ui.pending = null; ui.importMsg = { kind: 'err', text: t.error }; }
    else { ui.pending = planImport(t); ui.importMsg = null; }
    render(ui.pending ? '#reqName, [data-act="discardpending"]' : '#csvText');
    var target = document.querySelector('.review') || document.querySelector('.import .err');
    if (target) target.scrollIntoView({ block: 'center' });
    say(ui.pending ? 'Import checked. ' + ui.pending.stats.total + ' rows read, ' + ui.pending.stats.fresh + ' new.' : (ui.importMsg ? ui.importMsg.text : ''));
  }

  /* ---------- remote data (Supabase) ---------- */
  function dbItem(r) {
    return { id: r.id, no: r.no, date: r.item_date, desc: r.description, memo: r.memo, amount: r.amount, source: r.source, fp: r.fingerprint,
      owner: r.owner, status: r.status, note: r.note, isNew: r.is_new, requestId: r.request_id, reviewed: !!r.reviewed, sentBack: !!r.sent_back };
  }
  function fail(err, what) { ui.error = what + (err && err.message ? ' (' + err.message + ')' : ''); render(); }

  async function loadRemote() {
    var reqs = await remote.from('requests').select('*').order('imported_at', { ascending: false });
    if (reqs.error) return fail(reqs.error, 'Could not load requests.');
    var its = await remote.from('items').select('*').order('no');
    if (its.error) return fail(its.error, 'Could not load items.');
    var cm = await remote.from('comments').select('*').order('created_at');
    state.comments = {};
    if (!cm.error) cm.data.forEach(function (c) { (state.comments[c.fingerprint] = state.comments[c.fingerprint] || []).push({ id: c.id, role: c.role, kind: c.kind, body: c.body, at: c.created_at, author: c.author_id, edited: !!c.edited_at, removed: !!c.removed }); });
    var by = {};
    its.data.forEach(function (r) { (by[r.request_id] = by[r.request_id] || []).push(dbItem(r)); });
    var list = reqs.data.map(function (r) { return { id: r.id, name: r.name, importedAt: String(r.imported_at).slice(0, 10), items: by[r.id] || [] }; });
    var cur = list[0];
    state.items = cur ? cur.items : [];
    state.cycle = cur ? cur.name : '';
    state.currentId = cur ? cur.id : null;
    state.history = list.slice(1);
    if (ui.viewId && !state.history.some(function (h) { return h.id === ui.viewId; })) ui.viewId = null;
    ui.loading = false;
    render();
  }

  var reloadTimer = null;
  function scheduleReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadRemote, 400); }

  async function enterSession(session) {
    if (!session) { state.user = null; state.role = null; ui.loading = false; render(); return; }
    var m = await remote.from('members').select('role').eq('user_id', session.user.id).maybeSingle();
    if (m.error || !m.data) {
      await remote.auth.signOut();
      state.user = null; state.role = null; ui.loading = false;
      ui.authError = 'This email is not set up for Workpaper yet. Ask the account owner to add you.';
      render(); return;
    }
    state.user = session.user.email; state.uid = session.user.id; state.role = m.data.role; ui.authError = '';
    ui.sort = state.role === 'bookkeeper' ? 'open' : 'number';
    await loadRemote();
    remote.channel('items-live').on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, scheduleReload).on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, scheduleReload).subscribe();
  }

  function pushItem(it, fields) {
    if (!remote) return;
    remote.from('items').update(fields).eq('id', it.id).then(function (r) { if (r.error) { fail(r.error, 'Your change was not saved.'); scheduleReload(); } });
  }

  function pushMany(ids, fields) {
    if (!remote || !ids.length) return;
    remote.from('items').update(fields).in('id', ids).then(function (r) { if (r.error) { fail(r.error, 'Your change was not saved.'); scheduleReload(); } });
  }
  // say() only informs screen readers; announce() also shows a visible notice.
  function say(text) { var l = document.getElementById('live'); if (!l) return; l.textContent = ''; setTimeout(function () { l.textContent = text; }, 30); }
  function announce(text) { ui.notice = text; say(text); }
  function runBulk(kind, reason) {
    var items = selectedItems(), n = items.length, ids = items.map(function (i) { return i.id; }), msg = '';
    if (kind === 'tojeff') {
      items.forEach(function (i) { i.owner = 'jeff'; i.status = 'jeff'; i.reviewed = false; i.sentBack = false; });
      pushMany(ids, { owner: 'jeff', status: 'jeff' }); msg = 'Gave ' + n + (n === 1 ? ' item' : ' items') + ' to Jeff.';
    } else if (kind === 'takeback') {
      var back = items.filter(function (i) { return i.status === 'jeff'; }).map(function (i) { return i.id; });
      items.forEach(function (i) { i.owner = 'me'; if (i.status === 'jeff') i.status = 'waiting'; });
      pushMany(back, { owner: 'me', status: 'waiting' }); pushMany(ids.filter(function (x) { return back.indexOf(x) < 0; }), { owner: 'me' });
      msg = 'Took back ' + n + (n === 1 ? ' item' : ' items') + '.';
    } else if (kind === 'hubdoc') {
      items.forEach(function (i) { i.status = 'hubdoc'; i.reviewed = false; i.sentBack = false; });
      pushMany(ids, { status: 'hubdoc' }); msg = 'Marked ' + n + (n === 1 ? ' item' : ' items') + ' In Hubdoc.';
    } else if (kind === 'explain') {
      var blank = [], kept = 0;
      items.forEach(function (i) { i.status = 'explained'; i.reviewed = false; i.sentBack = false; if (!i.note) { i.note = reason; blank.push(i.id); } else kept++; });
      pushMany(ids, { status: 'explained' }); pushMany(blank, { note: reason });
      msg = 'Explained ' + n + (n === 1 ? ' item' : ' items') + '.' + (kept ? ' ' + kept + (kept === 1 ? ' kept its' : ' kept their') + ' existing note.' : '');
    }
    ui.sel = {}; ui.bulkExplain = false; ui.bulkErr = false; announce(msg); save();
  }

  async function pushImport(plan, name) {
    var r = await remote.from('requests').insert({ name: name }).select().single();
    if (r.error) { ui.importing = false; return fail(r.error, 'Could not create the request.'); }
    var rows = plan.items.map(function (it) {
      return { request_id: r.data.id, no: it.no, item_date: it.date, description: it.desc, memo: it.memo || '', amount: it.amount || '', source: it.source || '',
        fingerprint: it.fp, owner: it.owner, status: it.status, note: it.note || '', is_new: !!it.isNew, reviewed: !!it.reviewed, sent_back: !!it.sentBack };
    });
    var ins = await remote.from('items').insert(rows);
    if (ins.error) { ui.importing = false; await remote.from('requests').delete().eq('id', r.data.id); return fail(ins.error, 'Could not save the imported items.'); }
    ui.importing = false;
    await loadRemote();
  }

  /* ---------- actions ---------- */
  function setStatus(id, key, byJeff) {
    var it = state.items.find(function (x) { return x.id === id; });
    if (!it || !STATUS[key]) return;
    if (key !== it.status && key !== 'waiting') { it.reviewed = false; it.sentBack = false; }
    it.status = key;
    if (!byJeff) {
      if (key === 'jeff') it.owner = 'jeff';
      if (key === 'waiting') it.owner = 'me';
    }
    ui.drawId = id; ui.menuFor = null;
    if (!byJeff) say('Item ' + it.no + ': ' + roleLabel(key) + '.');
    save();
    pushItem(it, byJeff ? { status: key } : { status: key, owner: it.owner });
  }

          .catch(function (err) { ui.bulkDelete = false; ui.error = 'Could not delete' + (err && err.message ? ' (' + err.message + ')' : '') + '.'; render(); });

      if (k === 'date') ui.col = (c && c.key === 'date') ? null : { key: 'date', dir: -1 };
      else ui.col = !(c && c.key === 'amount') ? { key: 'amount', dir: -1 } : (c.dir === -1 ? { key: 'amount', dir: 1 } : null);
      render('[data-col="' + k + '"]'); say(!ui.col ? 'Default order.' : 'Sorted by ' + ui.col.key + ', ' + (ui.col.key === 'amount' ? (ui.col.dir === -1 ? 'largest first.' : 'smallest first.') : (ui.col.dir === -1 ? 'newest first.' : 'oldest first.'))); return;
    }
    if (d.act === 'togglefs') { ui.fsOpen = !ui.fsOpen; render('[data-act="togglefs"]'); return; }
    if (d.filter) { ui.filter = d.filter; render(); var nShown = shownItems().length; say('Showing ' + nShown + (nShown === 1 ? ' item.' : ' items.')); return; }
    if (d.sort) { ui.sort = d.sort; render(); say(d.sort === 'open' ? 'Open items first.' : 'In date order.'); return; }
    if (d.menu) { ui.menuFor = ui.menuFor === d.menu ? null : d.menu; render(ui.menuFor ? '.menu button[aria-checked="true"]' : '[data-menu="' + d.menu + '"]'); return; }
    if (d.set) { var p = d.set.split(':'); setStatus(p[0], p[1], false); render('[data-menu="' + p[0] + '"]'); return; }
    if (d.jset) {
      var q = d.jset.split(':');
      if (q[1] === 'missing') { ui.explainFor = q[0]; ui.reasonErr = null; render('#jr' + q[0]); var rb = document.querySelector('.reason'); if (rb) rb.scrollIntoView({ block: 'center' }); return; }
      var qi = state.items.find(function (x) { return x.id === q[0]; }); ui.jundo = { id: qi.id, status: qi.status, note: qi.note }; setStatus(q[0], q[1], true); announce('Item ' + qi.no + (q[1] === 'hubdoc' ? ' marked done.' : ' flagged.')); render('[data-jchange="' + q[0] + '"]'); return;
    }
    if (d.jsave) {
      var reason = ((document.getElementById('jr' + d.jsave) || {}).value || '').trim();
      if (!reason) { ui.reasonErr = d.jsave; render('#jr' + d.jsave); return; }
      var ji = state.items.find(function (x) { return x.id === d.jsave; });
      ui.jundo = { id: ji.id, status: ji.status, note: ji.note }; ji.note = reason; pushItem(ji, { note: reason });
      ui.explainFor = null; ui.reasonErr = null; setStatus(d.jsave, 'missing', true); announce('Item ' + ji.no + ' flagged as no document, with your reason.'); render('[data-jchange="' + d.jsave + '"]'); return;
    }
    if (d.jundo) {
      var u = ui.jundo; if (u) {
        var ui2 = state.items.find(function (x) { return x.id === u.id; });
        ui2.note = u.note; pushItem(ui2, { note: u.note }); setStatus(u.id, u.status, true);
        ui.jundo = null; announce('Item ' + ui2.no + ' put back.'); render('[data-jset="' + u.id + ':hubdoc"]');
      }
      return;
    }
    if (d.jcancel) { ui.explainFor = null; ui.reasonErr = null; render(); return; }
    if (d.jchange) { setStatus(d.jchange, 'jeff', true); var ci = state.items.find(function (x) { return x.id === d.jchange; }); announce('Item ' + ci.no + ' is waiting for you again.'); render('[data-jset="' + d.jchange + ':hubdoc"]'); return; }
    if (ui.menuFor) { ui.menuFor = null; render(); }
  });

  app.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'threadBody' && ui.threadFor) { ui.draft[ui.threadFor] = e.target.value; ui.threadErr = ''; }
    if (id === 'addEmail') ui.team.draft.email = e.target.value;
    else if (id === 'addPw') ui.team.draft.password = e.target.value;
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'addRole') { ui.team.draft.role = t.value; return; }
    if (t.dataset && t.dataset.teamrole) {
      var pid2 = t.dataset.teamrole, newRole = t.value;
      ui.team.busy = true; ui.team.msg = null;
      teamCall('setRole', { id: pid2, role: newRole }).then(function () { return teamCall('list'); })
        .then(function (r) { ui.team.people = r.people; ui.team.busy = false; ui.team.msg = { kind: 'ok', text: 'Role changed.' }; announce('Role changed.'); render(); })
        .catch(function (err) { ui.team.busy = false; ui.team.msg = { kind: 'err', text: err.message }; return teamCall('list').then(function (r) { ui.team.people = r.people; }).catch(function () {}).then(function () { render(); }); });
      return;
    }
    if (t.dataset.sel) { if (t.checked) ui.sel[t.dataset.sel] = 1; else delete ui.sel[t.dataset.sel]; ui.notice = ''; render('[data-sel="' + t.dataset.sel + '"]'); return; }
    if (t.dataset.selall) {
      var shownNow = shownItems(); ui.sel = {}; if (t.checked) shownNow.forEach(function (i) { ui.sel[i.id] = 1; });
      ui.notice = ''; ui.bulkExplain = false; render('[data-selall]'); return;
    }
    if (t.dataset.selmonth) {
      shownItems().filter(function (i) { return String(monthKey(i)) === t.dataset.selmonth; }).forEach(function (i) { if (t.checked) ui.sel[i.id] = 1; else delete ui.sel[i.id]; });
      ui.notice = ''; render('[data-selmonth="' + t.dataset.selmonth + '"]'); return;
    }
    if (t.dataset.owner) {
      var it = state.items.find(function (x) { return x.id === t.dataset.owner; });
      it.owner = t.value;
      // Handing an item over is one action: it always lands as With Jeff, and taking it back reopens it.
      if (t.value === 'jeff' && it.status !== 'jeff') { it.status = 'jeff'; ui.drawId = it.id; }
      if (t.value === 'me' && it.status === 'jeff') { it.status = 'waiting'; ui.drawId = it.id; }
      say('Item ' + it.no + (t.value === 'jeff' ? ' given to Jeff.' : ' taken back.')); save(); pushItem(it, { owner: it.owner, status: it.status }); render('#o' + it.id); return;
    }
    if (t.dataset.note) {
      var n = state.items.find(function (x) { return x.id === t.dataset.note; });
      n.note = t.value; save(); pushItem(n, { note: t.value }); return;
    }
    if (t.id === 'colSel') {
      var cv = t.value.split('-'); ui.col = t.value === 'date-asc' ? null : { key: cv[0], dir: cv[1] === 'desc' ? -1 : 1 };
      render('#colSel'); say('Sorted: ' + t.options[t.selectedIndex].text + '.'); return;
    }
    if (t.id === 'histSel' || t.id === 'histSel2') { ui.importOpen = false; ui.pending = null; ui.importMsg = null; ui.sel = {}; ui.notice = ''; ui.viewId = t.value || null; ui.filter = 'all'; render('#' + t.id); return; }
    if (t.id === 'csvFile' && t.files[0]) {
      var f = t.files[0], fr = new FileReader();
      if (/\.(xlsx|xls)$/i.test(f.name)) {
        ui.importMsg = { kind: 'ok', text: 'Reading the Excel file\u2026' }; render();
        ensureXLSX().then(function () {
          fr.onload = function () {
            try {
              var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
              stageRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }));
            } catch (err) { ui.importMsg = { kind: 'err', text: 'Could not read that Excel file. Try saving it as CSV.' }; render(); }
          };
          fr.readAsArrayBuffer(f);
        }).catch(function () { ui.importMsg = { kind: 'err', text: 'The Excel reader did not load. Check your connection, or save the sheet as CSV and try again.' }; render(); });
      } else {
        fr.onload = function () { stageRows(parseCSV(String(fr.result))); };
        fr.readAsText(f);
      }
    }
  });

  app.addEventListener('submit', function (e) {
    if (e.target.id === 'loginForm') {
      e.preventDefault();
      ui.email = document.getElementById('email').value.trim();
      if (useRemote && !remote) { ui.authError = 'The sign-in service is not available. Check your connection and refresh the page.'; render('#email'); return; }
      if (remote) {
        if (ui.busy) return;
        var pw = document.getElementById('password').value;
        ui.authError = ''; ui.busy = true; render();
        remote.auth.signInWithPassword({ email: ui.email, password: pw }).then(function (r) {
          ui.busy = false;
          if (r.error) {
            ui.authError = (r.error.status === 429 || /rate limit|too many/i.test(r.error.message || ''))
              ? 'Too many attempts. Wait a minute and try again.'
              : 'That email or password is not right.';
            render('#password'); return;
          }
          ui.loading = true; render(); enterSession(r.data.session);
        }).catch(function () { ui.busy = false; ui.authError = 'Could not reach the sign-in service. Check your connection and try again.'; render('#password'); });
        return;
      }
      ui.sent = true; render('[data-signin="client"]');
      return;
    }
    if (e.target.classList && e.target.classList.contains('tform')) {
      e.preventDefault();
      var fid = e.target.getAttribute('data-item'), fit = viewItems().find(function (x) { return x.id === fid; });
      var body = (document.getElementById('threadBody').value || '').trim();
      if (!fit) return;
      if (!body) { ui.threadErr = 'Write a message first.'; render('#threadBody'); return; }
      sendMessage(fit, body).then(function () { ui.draft[fid] = ''; ui.threadErr = ''; seen[seenKey(fit)] = new Date().toISOString(); saveSeen(); announce('Message sent.'); render('#threadBody'); })
        .catch(function (err) { ui.threadErr = 'Could not send the message' + (err && err.message ? ' (' + err.message + ')' : '') + '.'; render('#threadBody'); });
      return;
    }
    if (e.target.id === 'addForm') {
      e.preventDefault();
      if (ui.team.busy) return;
      var dr = ui.team.draft;
      ui.team.busy = true; ui.team.msg = null; render();
      teamCall('add', { email: dr.email, role: dr.role, password: dr.password }).then(function () {
        ui.team.msg = { kind: 'ok', text: 'Added ' + dr.email + '. Tell them their first password: ' + dr.password };
        ui.team.draft = { email: '', role: dr.role, password: '' };
        return teamCall('list');
      }).then(function (r) { ui.team.people = r.people; ui.team.busy = false; announce('Person added.'); render('#addEmail'); })
        .catch(function (err) { ui.team.busy = false; ui.team.msg = { kind: 'err', text: err.message }; render('#addEmail'); });
      return;
    }
    if (e.target.id === 'pwForm') {
      e.preventDefault();
      if (ui.busy || !remote) return;
      var cur = document.getElementById('pwCur').value, n1 = document.getElementById('pwNew').value, n2 = document.getElementById('pwNew2').value;
      function fail(text, focus) { ui.busy = false; ui.acctMsg = { kind: 'err', text: text }; render(focus); }
      if (n1.length < 10) { ui.acctMsg = { kind: 'err', text: 'The new password needs at least 10 characters.' }; render('#pwNew'); return; }
      if (n1 !== n2) { ui.acctMsg = { kind: 'err', text: 'The two new passwords do not match.' }; render('#pwNew2'); return; }
      if (n1 === cur) { ui.acctMsg = { kind: 'err', text: 'Choose a password that is different from the current one.' }; render('#pwNew'); return; }
      ui.busy = true; ui.acctMsg = null; render();
      // Check the current password first, so someone at an unattended screen cannot change it.
      remote.auth.signInWithPassword({ email: state.user, password: cur }).then(function (r) {
        if (r.error) return fail('The current password is not right.', '#pwCur');
        return remote.auth.updateUser({ password: n1 }).then(function (u) {
          if (u.error) return fail(/weak|short|least/i.test(u.error.message || '') ? 'That password is too weak. Try a longer one.' : 'Could not change the password. Try again.', '#pwNew');
          ui.busy = false; ui.accountOpen = false; ui.acctMsg = null; announce('Your password was changed.'); render('[data-act="account"]');
        });
      }).catch(function () { fail('Could not reach the service. Check your connection and try again.', '#pwCur'); });
    }
  });

  // Close the status menu when focus moves to something else. Runs after the event so a re-render (which briefly drops focus) does not close it.
  app.addEventListener('focusout', function () {
    if (!ui.menuFor) return;
    setTimeout(function () {
      var at = document.activeElement;
      if (!ui.menuFor || !at || at === document.body || (at.closest && at.closest('.menu')) || (at.dataset && at.dataset.menu)) return;
      var menuNode = app.querySelector('.menu'), trigger = app.querySelector('[data-menu="' + ui.menuFor + '"]');
      if (menuNode) { var mr = menuNode.closest('.row'); menuNode.remove(); if (mr) mr.classList.remove('open-menu'); }
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
      ui.menuFor = null;
    }, 0);
  });

  document.addEventListener('keydown', function (e) {
    var menuEl = e.target.closest && e.target.closest('.menu');
    if (menuEl && ['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(e.key) > -1) {
      e.preventDefault();
      var btns = Array.prototype.slice.call(menuEl.querySelectorAll('button')), at = btns.indexOf(document.activeElement);
      var to = e.key === 'Home' ? 0 : e.key === 'End' ? btns.length - 1 : e.key === 'ArrowDown' ? (at + 1) % btns.length : (at - 1 + btns.length) % btns.length;
      btns[to].focus(); return;
    }
    if (e.key === 'ArrowDown' && e.target.classList && e.target.classList.contains('tickbtn') && !ui.menuFor) { e.preventDefault(); e.target.click(); return; }
    if (e.key === 'Escape' && ui.menuFor) { var id = ui.menuFor; ui.menuFor = null; render('[data-menu="' + id + '"]'); }
  });

  render();
  if (useRemote) {
    loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2').then(function () {
      remote = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      remote.auth.getSession().then(function (r) { enterSession(r.data.session); });
      remote.auth.onAuthStateChange(function (ev, session) { if (ev === 'SIGNED_OUT') { state.user = null; state.role = null; render(); } });
    }).catch(function () {
      ui.loading = false; ui.authError = 'Could not reach the sign-in service. Check your connection and refresh.'; render();
    });
  }
})();
</script>
</body>
</html>
